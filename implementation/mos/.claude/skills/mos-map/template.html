<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Monde : manence.ai (ardoise, sombre seul — parti pris assumé, pas une omission).
     Grammaire : un type d'objet = un composant. v4 post-audit : classes préfixées mos-. */
  :root{
    --paper:#0F1420; --paper-deep:#0B101B; --paper-raise:#161C2C; --paper-card:#131928;
    --ink:#E8E9E1; --ink-strong:#F6F6F0; --ghost:#8A93AD; --rule:#28304A; --rule-soft:#1E2536;
    --encre:#8CA0F2; --savoir:#6FDEC0; --systeme:#5AA7FF; --deploy:#FF9C4A; --or:#E0B64F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.5}
  button{font-family:inherit}
  a{color:var(--encre)}
  :focus-visible{outline:2px solid var(--encre);outline-offset:2px}
  .mos-wrap{max-width:1280px;margin:0 auto;padding:18px 22px 28px}
  .mos-entete{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .mos-kicker{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ghost);margin:0 0 .3rem}
  h1{font-size:clamp(1.3rem,2.8vw,1.8rem);font-weight:600;margin:0;color:var(--ink-strong)}
  h1 .mos-fil{color:var(--ghost);font-weight:400;margin:0 .25rem}
  h1 button{background:none;border:none;color:var(--encre);font:inherit;cursor:pointer;padding:0}
  h1 button:hover{text-decoration:underline}
  h1 .mos-ici{color:var(--ink-strong)}
  .mos-meta{font-family:var(--mono);font-size:.68rem;color:var(--ghost);text-align:right}
  .mos-meta b{color:var(--ink);font-weight:600}
  mos-facade,mos-explorer,mos-graphe,mos-fiche,mos-frise{display:block}
  .mos-erreur{margin-top:14px;border:1px solid var(--deploy);border-radius:12px;background:var(--paper-card);
    padding:1rem 1.1rem;font-size:.9rem}
  .mos-erreur b{color:var(--deploy)}

  /* ===== mos-facade ===== */
  .mos-stage{position:relative;margin-top:14px;border:1px solid var(--rule);border-radius:16px;
    background:radial-gradient(ellipse 55% 60% at 50% 46%, #141B2E 0%, var(--paper-deep) 75%);
    padding:26px 24px;overflow:hidden}
  .mos-fils{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* chaque sommet a un rôle : nord = production (au-dessus), sud = KB (en dessous),
     les 4 diagonales = connecteurs (côté déductible de la famille, surchargeable par `cote`) */
  .mos-grille{position:relative;display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .mos-haut,.mos-bas{display:flex;justify-content:center;z-index:2}
  .mos-haut .mos-carte,.mos-bas .mos-carte{width:min(100%,440px)}
  .mos-milieu{display:grid;grid-template-columns:285px 1fr 285px;gap:18px;align-items:center;min-height:340px}
  .mos-colg,.mos-cold{display:flex;flex-direction:column;gap:14px;z-index:2;justify-content:center}
  .mos-carte{background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;
    padding:.75rem .85rem .7rem 1rem;position:relative;cursor:pointer;text-align:left;color:var(--ink);
    transition:border-color .15s, transform .15s;display:block;width:100%}
  .mos-carte::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc,var(--ghost))}
  .mos-carte:hover,.mos-carte:focus-visible{border-color:var(--acc,var(--ghost));transform:translateY(-1px)}
  .mos-carte .t{display:block;font-size:.96rem;font-weight:600;color:var(--ink-strong)}
  .mos-carte .n{display:block;font-family:var(--mono);font-size:.67rem;color:var(--ghost);margin-top:.18rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mos-carte .n b{color:var(--acc,var(--ghost));font-weight:600}
  .mos-carte .fleche{position:absolute;right:.7rem;top:.7rem;color:var(--acc,var(--ghost));opacity:0;transition:opacity .15s;font-size:.8rem}
  .mos-carte:hover .fleche,.mos-carte:focus-visible .fleche{opacity:1}
  .mos-carte.est-mos .fleche{opacity:.6}
  .mos-centre{position:relative;display:flex;align-items:center;justify-content:center;z-index:1}
  .mos-hexbox{width:min(100%,360px);aspect-ratio:1/0.92;position:relative}
  .mos-hexsvg{width:100%;height:100%;display:block}
  .mos-hexa{fill:rgba(140,160,242,.045);stroke:var(--encre);stroke-width:1.6;filter:drop-shadow(0 0 14px rgba(140,160,242,.35))}
  .mos-sommet{stroke:var(--paper-deep);stroke-width:2.5}
  /* pointer-events:none : la couche centrale ne doit pas voler le survol/clic des sommets du SVG dessous */
  .mos-coeur-int{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;text-align:center;padding:0 15%;pointer-events:none}
  .mos-coeur-int .mos-organe{pointer-events:auto}
  .mos-coeur-int .sur{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--encre)}
  .mos-coeur-int .nom{font-size:1.4rem;font-weight:700;color:var(--ink-strong)}
  .mos-coeur-int .quoi{font-size:.8rem;color:var(--ghost)}
  .mos-organes{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
  .mos-organe{font-family:var(--mono);font-size:.65rem;padding:.28rem .6rem;border-radius:999px;
    border:1px solid var(--rule);background:var(--paper-raise);color:var(--ink);cursor:pointer}
  .mos-organe b{color:var(--encre);font-weight:600}
  .mos-organe:hover{border-color:var(--encre)}
  .mos-legende{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem;position:relative;z-index:2}
  .mos-lg{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.65rem;color:var(--ghost)}
  .mos-lg i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}
  .mos-pouls{margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--rule-soft);display:flex;gap:.6rem;align-items:baseline;
    font-family:var(--mono);font-size:.69rem;color:var(--ghost);flex-wrap:wrap;position:relative;z-index:2}
  .mos-pouls .pt{width:7px;height:7px;border-radius:50%;background:var(--savoir);align-self:center;box-shadow:0 0 6px var(--savoir)}
  .mos-pouls b{color:var(--ink);font-weight:600}
  .mos-pouls .lien{margin-left:auto;color:var(--encre);cursor:pointer;background:none;border:none;font-family:var(--mono);font-size:.69rem;padding:0}
  .mos-pouls .lien:hover{text-decoration:underline}
  /* agencement : les sommets diagonaux SONT les cibles — halo pointillé pendant le drag,
     ＋ au survol d'un coin pour ajouter un connecteur directement dessus */
  .mos-carte[data-drag]{cursor:grab;touch-action:none}
  .mos-carte.en-cours-drag{opacity:.4}
  .som-cible{cursor:pointer}
  .som-cible .halo{fill:none;stroke-dasharray:4 4;stroke-width:1.4;opacity:0;transition:opacity .15s, r .15s}
  .mos-stage.drag-actif .som-cible .halo{opacity:.75}
  @keyframes mos-fourmis{to{stroke-dashoffset:-16}}
  /* même langage au survol souris (pour le ＋) et au survol de drag : halo pointillé animé + point agrandi */
  .som-cible.survole .halo,.som-cible:hover .halo{opacity:1;stroke-width:2.2;r:18;animation:mos-fourmis .5s linear infinite}
  .som-cible .pt-som{transition:r .15s}
  .mos-stage.drag-actif .som-cible .pt-som{r:8}
  .som-cible.survole .pt-som,.som-cible:hover .pt-som{r:10}
  @media (prefers-reduced-motion:reduce){.som-cible.survole .halo,.som-cible:hover .halo{animation:none}}
  /* le fantôme de drag : la carte suit le pointeur, SON POINT au bord droit est la référence —
     on aligne le point de la boîte sur le point pointillé du sommet */
  .carte-ghost{position:fixed;z-index:60;pointer-events:none;opacity:.93;box-shadow:0 10px 34px rgba(0,0,0,.55);
    left:0;top:0;transition:none !important} /* sans ça, le premier placement ANIME depuis le coin de l'écran */
  .carte-ghost::before{display:none} /* la barre d'accent disparaît : un seul point d'ancrage, à gauche
     (la double ancre a été essayée puis écartée : les deux points pouvaient toucher deux angles à la fois) */
  .carte-ghost::after{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;border-radius:50%;background:var(--acc,var(--ghost));border:2.5px solid var(--paper-deep);
    box-shadow:0 0 10px var(--acc,transparent)}
  /* la corbeille : à droite de la carte Production (nord), visible seulement pendant un drag */
  .mos-haut{position:relative}
  .corbeille{position:absolute;left:calc(50% + 234px);top:50%;transform:translateY(-50%);z-index:4;
    width:52px;height:52px;border-radius:50%;border:1.6px dashed var(--rule);display:none;
    align-items:center;justify-content:center;font-size:1.2rem;background:var(--paper-deep);
    transition:transform .12s, border-color .12s}
  .mos-stage.drag-actif .corbeille{display:flex}
  .corbeille.survole{border-color:#FF6B72;transform:translateY(-50%) scale(1.18);box-shadow:0 0 14px rgba(255,107,114,.35)}
  .som-cible .pt-fantome{opacity:.22}
  .som-cible:hover .pt-fantome{opacity:.55}
  .som-cible .hit{fill:transparent;pointer-events:all}
  .som-cible .som-plus{fill:var(--ink-strong);font-size:13px;text-anchor:middle;opacity:0;
    pointer-events:none;font-family:var(--mono);transition:opacity .15s;paint-order:stroke;stroke:var(--paper-deep);stroke-width:2px}
  .som-cible:hover .som-plus{opacity:1}
  .mos-stage.drag-actif .som-cible .som-plus{opacity:0 !important}
  .mos-agence{display:flex;gap:.5rem;justify-content:center;margin-top:.7rem;position:relative;z-index:2;flex-wrap:wrap}
  .mos-agence button{font-family:var(--mono);font-size:.65rem;padding:.25rem .65rem;border-radius:999px;
    border:1px solid var(--rule);background:var(--paper-raise);color:var(--ghost);cursor:pointer}
  .mos-agence button:hover{border-color:var(--encre);color:var(--ink)}
  dialog.mos-dialog label.choix{display:flex;align-items:baseline;gap:.5rem;border-top:1px solid var(--rule);
    padding:.5rem 0;cursor:pointer;font-size:.85rem}
  dialog.mos-dialog label.choix .n2{font-family:var(--mono);font-size:.66rem;color:var(--ghost)}
  dialog.mos-dialog label.choix input{accent-color:#8CA0F2}

  /* ===== mos-explorer ===== */
  .mos-explo{display:grid;grid-template-columns:265px 1fr;gap:14px;margin-top:14px;align-items:start}
  .mos-arbre{background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;padding:.6rem .4rem;
    max-height:74vh;overflow:auto;font-family:var(--mono);font-size:.74rem}
  .mos-arbre ul{list-style:none;margin:0;padding:0 0 0 .85rem}
  .mos-arbre>ul{padding-left:.2rem}
  .mos-arbre li{margin:.05rem 0}
  .mos-arbre .ligne{display:flex;align-items:center;border-radius:6px;color:var(--ghost)}
  .mos-arbre li:focus-visible{outline:none}
  .mos-arbre li:focus-visible>.ligne{outline:2px solid var(--encre);outline-offset:-1px}
  .mos-arbre .ligne:hover{background:var(--paper-raise);color:var(--ink)}
  .mos-arbre li[aria-selected="true"]>.ligne{background:var(--paper-raise);color:var(--ink-strong)}
  .mos-arbre .tw{width:1.2em;flex:none;font-size:.62rem;color:var(--ghost);background:none;border:none;cursor:pointer;
    padding:.16rem 0 .16rem .25rem;font-family:inherit;text-align:left}
  .mos-arbre .tw:hover{color:var(--ink-strong)}
  .mos-arbre span.tw{cursor:default}
  .mos-arbre .nomb{display:flex;align-items:center;gap:.3rem;flex:1;min-width:0;padding:.16rem .4rem .16rem 0;cursor:pointer}
  .mos-arbre .ico{flex:none;width:8px;height:8px;border-radius:2px;background:var(--ghost);opacity:.6}
  .mos-arbre .ico.d-kb{background:var(--savoir)} .mos-arbre .ico.d-prod{background:var(--or)} .mos-arbre .ico.d-inbox{background:var(--encre)}
  .mos-arbre .ico.f{border-radius:50%;opacity:.45}
  .mos-contenu{min-width:0}
  .mos-ariane{font-family:var(--mono);font-size:.7rem;color:var(--ghost);margin:.15rem 0 .75rem;display:flex;gap:.3rem;flex-wrap:wrap}
  .mos-ariane button{background:none;border:none;color:var(--encre);font:inherit;cursor:pointer;padding:0}
  .mos-ariane button:hover{text-decoration:underline}
  .mos-ariane .sep{color:var(--ghost)}
  .mos-ariane .ici{color:var(--ink)}
  .mos-enfants{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem;margin-top:.9rem}
  .mos-obj{background:var(--paper-card);border:1px solid var(--rule);border-radius:10px;padding:.6rem .75rem;
    cursor:pointer;text-align:left;color:var(--ink);border-left:3px solid var(--acc,var(--rule));display:block;width:100%}
  .mos-obj:hover,.mos-obj:focus-visible{border-color:var(--acc,var(--encre))}
  .mos-obj .k{display:block;font-family:var(--mono);font-size:.62rem;color:var(--ghost)}
  .mos-obj .t{display:block;margin:.12rem 0 .15rem;font-size:.88rem;font-weight:600;color:var(--ink-strong);line-height:1.3}
  .mos-obj .p{display:block;margin:0;font-size:.76rem;color:var(--ghost);line-height:1.45}
  .mos-puce{display:inline-block;font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;
    padding:.05rem .4rem;border-radius:999px;border:1px solid var(--rule)}
  /* statuts : jaune proposal · vert validated · bleu canon · rouge rejected */
  .mos-puce.st-proposal{color:#E0B64F} .mos-puce.st-validated{color:#8FB89B}
  .mos-puce.st-canon{color:#5AA7FF} .mos-puce.st-rejected{color:#FF6B72}
  .mos-obj{position:relative}
  .st-pt{position:absolute;top:.6rem;right:.65rem;width:9px;height:9px;border-radius:50%;
    box-shadow:0 0 0 2px var(--paper-card)}
  .st-pt.st-proposal{background:#E0B64F} .st-pt.st-validated{background:#8FB89B}
  .st-pt.st-canon{background:#5AA7FF} .st-pt.st-rejected{background:#FF6B72}
  .mos-h3{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--or);font-weight:600;margin:.8rem 0 .1rem}
  /* recherche KB (plein texte) */
  .mos-cherche{margin:0 0 .6rem}
  .mos-cherche input{width:100%;max-width:520px;background:var(--paper-card);border:1px solid var(--rule);
    border-radius:9px;color:var(--ink);font-family:var(--mono);font-size:.8rem;padding:.45rem .7rem}
  .mos-cherche input::placeholder{color:var(--ghost)}
  .mos-cherche input:focus{outline:none;border-color:var(--encre)}
  .mos-resultats{display:flex;flex-direction:column;gap:.4rem;margin:.2rem 0 .8rem;max-width:720px}
  .mos-res{background:var(--paper-card);border:1px solid var(--rule);border-radius:9px;padding:.5rem .7rem;
    cursor:pointer;text-align:left;color:var(--ink);position:relative}
  .mos-res:hover,.mos-res:focus-visible{border-color:var(--encre)}
  .mos-res .t{font-weight:600;color:var(--ink-strong);font-size:.86rem}
  .mos-res .d{font-family:var(--mono);font-size:.62rem;margin-left:.4rem}
  .mos-res .x{display:block;font-size:.76rem;color:var(--ghost);margin-top:.15rem;line-height:1.45}
  .mos-res mark{background:rgba(140,160,242,.28);color:var(--ink-strong);border-radius:2px;padding:0 .08em}
  .mos-noeud.efface{opacity:.1} .mos-arete.efface{opacity:.04}
  .mos-noeud,.mos-arete{transition:opacity .15s}
  .mos-detail{background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;padding:.9rem 1rem;max-width:760px}
  .mos-detail .k{font-family:var(--mono);font-size:.64rem;color:var(--or)}
  .mos-detail h2{margin:.2rem 0 .3rem;font-size:1.15rem;color:var(--ink-strong)}
  .mos-detail p{margin:.2rem 0;font-size:.85rem}
  .mos-detail .g{color:var(--ghost)}
  .mos-fichiers{font-family:var(--mono);font-size:.72rem;color:var(--ghost);columns:2;column-gap:2rem;margin-top:.6rem}
  .mos-fichiers div{break-inside:avoid;padding:.1rem 0}
  .mos-vide{color:var(--ghost);font-size:.85rem;margin:.9rem 0;font-style:italic}
  .mos-h2{font-family:var(--mono);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ghost);font-weight:600;margin:1.2rem 0 .5rem;border-bottom:1px solid var(--rule-soft);padding-bottom:.3rem}
  .mos-h2:first-of-type{margin-top:.2rem}
  @media (max-width:860px){.mos-fichiers{columns:1}}

  /* ===== mos-graphe ===== */
  mos-graphe .scene{position:relative;height:min(68vh,660px);background:radial-gradient(ellipse 60% 55% at 50% 48%, #131A29 0%, var(--paper-deep) 78%);
    border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  mos-graphe svg{cursor:grab} mos-graphe svg:active{cursor:grabbing}
  mos-graphe .outils{position:absolute;right:.6rem;bottom:.6rem;display:flex;flex-direction:column;gap:.3rem;z-index:3}
  mos-graphe .outils button{width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);
    background:var(--paper-raise);color:var(--ink);font-size:.95rem;cursor:pointer}
  mos-graphe .outils button:hover{border-color:var(--encre)}
  @media (min-width:721px){ .mos-enfants.avec-graphe{display:none} } /* la nav suffit : toute la hauteur va à la carte */
  mos-graphe svg{width:100%;height:100%;display:block}
  mos-graphe .titre-g{position:absolute;left:.8rem;top:.6rem;font-family:var(--mono);font-size:.64rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ghost)}
  mos-graphe .mode-g{position:absolute;right:.6rem;top:.5rem;display:flex;gap:.25rem;z-index:3}
  mos-graphe .mode-g button{font-family:var(--mono);font-size:.62rem;padding:.18rem .5rem;border-radius:999px;
    border:1px solid var(--rule);background:var(--paper-raise);color:var(--ghost);cursor:pointer}
  mos-graphe .mode-g button.actif{color:var(--ink);border-color:var(--encre)}
  .mos-arete{fill:none;pointer-events:none;stroke:#8CA0F2;stroke-opacity:.6}
  .mos-arete.vers-ghost{stroke-dasharray:4 4;stroke-opacity:.4}
  .mos-noeud{cursor:pointer}
  .mos-noeud .disque{fill:var(--paper-raise);stroke-width:2}
  .mos-noeud.ghost .disque{stroke-dasharray:3 3;stroke-opacity:.6;fill:transparent}
  .mos-noeud.ghost .etiquette{fill:var(--ghost)}
  .mos-noeud .etiquette{text-anchor:middle;fill:var(--ink);font-family:var(--mono);font-size:9.4px;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
  .mos-bulle{position:absolute;max-width:300px;pointer-events:none;z-index:5;background:var(--paper-raise);
    border:1px solid var(--rule);border-radius:8px;padding:.5rem .7rem;font-size:.77rem;line-height:1.45}
  .mos-bulle .t{font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase}
  @media (max-width:720px){mos-graphe{display:none}} /* le graphe se replie, il ne casse pas */

  /* ===== mos-fiche ===== */
  mos-fiche .corps{background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.1rem;max-width:760px}
  mos-fiche .chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.4rem}
  mos-fiche h2{margin:.1rem 0 .3rem;font-size:1.25rem;color:var(--ink-strong)}
  mos-fiche .desc{font-size:.9rem;color:var(--ghost);margin:.1rem 0 .6rem}
  mos-fiche .review{font-family:var(--mono);font-size:.72rem;color:var(--or);margin:.2rem 0 .5rem}
  mos-fiche .extrait{font-size:.92rem;line-height:1.6;border-left:2px solid var(--rule);padding-left:.85rem;margin:.7rem 0}
  mos-fiche h3{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ghost);margin:1rem 0 .35rem;font-weight:600}
  mos-fiche ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
  mos-fiche li button{background:none;border:none;color:var(--encre);font-family:var(--mono);font-size:.76rem;cursor:pointer;padding:0;text-align:left}
  mos-fiche li button:hover{text-decoration:underline}
  mos-fiche .vide-l{color:var(--ghost);font-size:.76rem;font-family:var(--mono)}

  /* ===== rendu markdown (le registre du site : serif, ~65ch) ===== */
  .mos-md{font-size:.95rem;line-height:1.65;max-width:68ch;margin-top:.6rem}
  .mos-md p{margin:.55rem 0}
  .mos-md h3,.mos-md h4,.mos-md h5,.mos-md h6{color:var(--ink-strong);font-weight:600;line-height:1.3;margin:1.1rem 0 .35rem}
  .mos-md h3{font-size:1.12rem} .mos-md h4{font-size:1rem}
  .mos-md h5,.mos-md h6{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost)}
  .mos-md ul,.mos-md ol{margin:.45rem 0;padding-left:1.4rem}

/* ---------- routage sûr : "" | log | x/<segments> ---------- */
function route(){
  const brut = location.hash.slice(1);
  if (!brut) return {vue:"facade"};
  const segs = [];
  for (const s of brut.split("/")){
    try{ segs.push(decodeURIComponent(s)); }
    catch{ return {vue:"facade", invalide:true}; }
  }
  if (segs[0]==="log" && segs.length===1) return {vue:"log"};
  if (segs[0]==="x" && segs.length>1) return {vue:"explorer", path:segs.slice(1).join("/")};
  return {vue:"facade", invalide:true};
}
const va = h => { location.hash = h==="" ? "" : "#"+h.split("/").map(encodeURIComponent).join("/"); };
const vaChemin = p => va("x/"+p);
function render(){
  const app = $("#mos-app");
  try{
    const r = route();
    if (r.invalide && location.hash) history.replaceState(null, "", location.pathname + location.search);
    app.innerHTML = "";
    let el;
    if (r.vue==="facade") el = document.createElement("mos-facade");
    else if (r.vue==="log") el = document.createElement("mos-frise");
    else { el = document.createElement("mos-explorer"); el.setAttribute("path", r.path); }
    app.appendChild(el);
    const fil = r.vue==="facade" ? html`<span class="mos-ici">${M.nom}</span>`
      : html`<button data-h="">${M.nom}</button><span class="mos-fil">/</span><span class="mos-ici">${r.vue==="log"?"log":(r.path.split("/").pop())}</span>`;
    setH($("#mos-titre"), fil);
    $("#mos-titre").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>va(b.dataset.h));
    setH($("#mos-pied"), html`${M.nom} · ${T.piedCadre} <b>v${M.meta.version||"?"}</b> · ${T.piedProfil} <b>${M.profil}</b> · ${T.piedGenere} <b>__DATE__</b>

      M.meta.avertissements.length?html`<br/>⚠ ${M.meta.avertissements.join(" · ")}`:""}`);
  }catch(err){
    setH(app, html`<div class="mos-erreur"><b>${T.errVue}</b><br/>${String(err)}<br/>
      <button data-h="" style="margin-top:.5rem">${T.errRetour}</button></div>`);
    app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ location.hash=""; });
  }
}
window.addEventListener("hashchange", render);

/* ---------- markdown → HTML sûr (sous-ensemble OKF ; tout texte passe par esc) ---------- */
function resoudre(rel, courant){
  if (!/\.md$/.test(rel)) return null;
  const base = courant.split("/").slice(0, -1);
  for (const seg of rel.split("/")){
    if (seg === "." || seg === "") continue;
    else if (seg === ".."){ if (!base.length) return null; base.pop(); }
    else base.push(seg);
  }
  const p = base.join("/");
  return parPath.has(p) ? p : null;
}

  const fermer = () => { while (pile.length) out += `</${pile.pop()}>`; };
  const inline = t => {
    let s = esc(t);
    s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (m, alt) => `<span class="md-img">🖼 ${alt || esc(T.mdImage)}</span>`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => {
      url = url.replace(/&amp;/g, "&").replace(/&quot;|&#39;/g, "");
      if (/^https?:\/\//.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`;
      const cible = resoudre(url.split("#")[0], courant);
      if (cible) return `<button class="md-lien" data-h="x/${esc(cible)}">${txt}</button>`;
      return `<span class="md-lien-mort" title="${esc(url)}">${txt}</span>`;
    });
    return s;
  };
  for (let i = 0; i < lignes.length; i++){
    const l = lignes[i];
    if (/^```/.test(l)){ fermer(); out += enCode ? "</code></pre>" : "<pre><code>"; enCode = !enCode; continue; }
    if (enCode){ out += esc(l) + "\n"; continue; }
    if (/^\s*$/.test(l)){ fermer(); continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))){ fermer(); const n = Math.min(6, m[1].length + 2);
      out += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)){ fermer(); out += "<hr/>"; continue; }
    if ((m = l.match(/^>\s?(.*)/))){ fermer(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^(\s*)[-*+]\s+(.*)/))){
      const prof = m[1].length >= 2 ? 2 : 1;
      while (pile.length > prof) out += `</${pile.pop()}>`;
      while (pile.length < prof){ out += "<ul>"; pile.push("ul"); }
      out += `<li>${inline(m[2])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+\.\s+(.*)/))){
      if (pile[pile.length - 1] !== "ol"){ fermer(); out += "<ol>"; pile.push("ol"); }
      out += `<li>${inline(m[1])}</li>`; continue; }
    if (/^\|/.test(l)){
      fermer();
      const rows = [];
      while (i < lignes.length && /^\|/.test(lignes[i])) rows.push(lignes[i++]);
      i--;
      const corps = rows.filter(r => !/^\|[\s\-:|]+\|?\s*$/.test(r));
      const cellules = r => r.replace(/^\||\|\s*$/g, "").split("|").map(c => inline(c.trim()));
      out += `<div class="md-table"><table>` + corps.map((r, j) =>
        `<tr>${cellules(r).map(c => `<${j ? "td" : "th"}>${c}</${j ? "td" : "th"}>`).join("")}</tr>`).join("") + `</table></div>`;
      continue; }
    fermer(); out += `<p>${inline(l)}</p>`;
  }
  fermer(); if (enCode) out += "</code></pre>";
  return {__raw: `<div class="mos-md">${out}</div>`};
}

/* ---------- agencement personnalisé de la façade (drag & drop + choix des connecteurs) ----------
   Les changements vivent en localStorage (immédiats, propres à ce navigateur) ; le bouton
   « copier la déclaration » rend le mos-map.json à jour — le FICHIER reste la source de vérité. */
const clePerso = "mosmap:" + M.nom + ":agencement";
const chargerPerso = () => { try{ return JSON.parse(localStorage.getItem(clePerso) || "{}"); }catch{ return {}; } };
const sauverPerso = p => { try{ localStorage.setItem(clePerso, JSON.stringify(p)); }catch{} };
const estPilier = a => a.nature === "kb" || a.nature === "production";
function attachesEffectives(){
  const p = chargerPerso();
  return M.attaches.map(a => ({...a,
    sommet: (!estPilier(a) && p.sommets?.[a.id] !== undefined) ? p.sommets[a.id] : a.sommet,
    visible: estPilier(a) ? true : (p.visibles?.[a.id] ?? (a.visible !== false))}));
}
function sommetLibre(){
  const comptes = new Map([[1,0],[2,0],[4,0],[5,0]]);
  for (const a of attachesEffectives())
    if (a.visible && !estPilier(a) && comptes.has((a.sommet??0)%6))
      comptes.set((a.sommet??0)%6, comptes.get((a.sommet??0)%6)+1);
  return [...comptes.entries()].sort((x,y)=>x[1]-y[1])[0][0];
}
/* enregistrer la déclaration dans le fichier : File System Access API (Chromium — vrai dialogue
   « Enregistrer », écrit dans .claude/mos-map.json) ; repli : téléchargement du fichier. */
async function enregistrerFichier(){
  const contenu = declarationAJour();
  if (window.showSaveFilePicker){
    try{
      const h = await window.showSaveFilePicker({suggestedName: "mos-map.json",
        types: [{description: T.carteDuMos, accept: {"application/json": [".json"]}}]});
      const w = await h.createWritable(); await w.write(contenu); await w.close();
      return T.enregistre;
    }catch(e){ if (e.name === "AbortError") return null; }
  }
  const blob = new Blob([contenu], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "mos-map.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  return T.telecharge;
}
function declarationAJour(){
  const p = chargerPerso();
  const attaches = M.attaches.map(a => {
    const s = (!estPilier(a) && p.sommets?.[a.id] !== undefined) ? p.sommets[a.id] : a.sommet;
    const v = estPilier(a) ? true : (p.visibles?.[a.id] ?? (a.visible !== false));
    const out = {...a, sommet: s};
    if (!v) out.visible = false; else delete out.visible;
    return out;
  });
  return JSON.stringify({schema: 2, attaches, routines: M.routines}, null, 2);
}

  pose(){

    const angles=[-150,-90,-30,30,90,150];
    const pts=angles.map(a=>[cx+Math.cos(a*Math.PI/180)*R, cy+Math.sin(a*Math.PI/180)*R]);
    /* sommets : piliers en points pleins ; les 4 diagonales sont des CIBLES vivantes —
       halo pointillé pendant un drag, ＋ au survol pour ajouter directement sur ce coin */
    const occupes = new Set((this._att||[]).map(a=>(a.sommet??0)%6));

    for (const s of [0,3]) if (occupes.has(s)){

      dedans += `<circle class="mos-sommet" cx="${pts[i][0]}" cy="${pts[i][1]}" r="5.5" fill="${SOMMETS[s].coul}"/>`;
    }

    const stage=this.querySelector(".mos-stage"), fils=this.querySelector(".mos-fils");
    const rs=stage.getBoundingClientRect();
    if (rs.width<980 || !window.matchMedia("(min-width: 981px)").matches){ fils.innerHTML=""; return; }
    fils.setAttribute("viewBox",`0 0 ${rs.width} ${rs.height}`);

    const ccx=rb.left-rs.left+rb.width/2, ccy=rb.top-rs.top+rb.height/2, RR=Math.min(rb.width,rb.height)/2-8;
    const A=a=>[ccx+Math.cos(a*Math.PI/180)*RR, ccy+Math.sin(a*Math.PI/180)*RR];

      const el = this.querySelector(`[data-a="${CSS.escape(a.id)}"]`);
      const s = (a.sommet??0)%6, som = SOMMETS[s];
      const attache = s===0 ? "bas" : s===3 ? "haut" : (s===1||s===2) ? "gauche" : "droite";
      return [el, A(som.ang), NATL[a.nature] ?? a.nature ?? "", som.coul, attache];

    let out="";
    for (const [el,[x2,y2],label,coul,attache] of liaisons){
      if(!el) continue;

      let x1, y1;
      if (attache==="bas"){ x1=r.left-rs.left+r.width/2; y1=r.bottom-rs.top; }
      else if (attache==="haut"){ x1=r.left-rs.left+r.width/2; y1=r.top-rs.top; }
      else if (attache==="droite"){ x1=r.right-rs.left; y1=r.top-rs.top+r.height/2; }
      else { x1=r.left-rs.left; y1=r.top-rs.top+r.height/2; }
      out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${coul};stroke-opacity:.38;stroke-width:1.2"><title>${esc(label)}</title></line>
        <circle cx="${x1}" cy="${y1}" r="3.6" fill="${coul}" stroke="var(--paper-deep)" stroke-width="1.5"/>`;
    }
    fils.innerHTML=out;
  }
}

/* ================= mos-explorer (treeview conforme : un seul arrêt de tabulation) ================= */
class MosExplorer extends HTMLElement{
  connectedCallback(){
    const path = this.getAttribute("path");
    const cle = "mosmap:"+M.nom+":exp";
    let exp;
    try{ exp = new Set(JSON.parse(localStorage.getItem(cle)||"[]").filter(p=>parPath.has(p))); }
    catch{ exp = new Set(); }
    for (let p = path; p; p = parents.get(p)) if (noeudDe(p)?.kind==="dir") exp.add(p);
    const sauver = ()=>{ try{ localStorage.setItem(cle, JSON.stringify([...exp])); }catch{} };

    const liTree = (n, niveau) => {
      const isDir = n.kind==="dir", open = exp.has(n.path);
      const ico = !isDir ? html`<span class="ico f"></span>`
        : html`<span class="ico ${n.path.startsWith("knowledge-base")?"d-kb":n.path.startsWith("inbox")?"d-inbox":"d-prod"}"></span>`;
      return html`<li role="treeitem" aria-level="${niveau}" aria-selected="${n.path===path}"
          ${isDir&&n.children?.length?{__raw:` aria-expanded="${open}"`}:""} data-p="${n.path}" data-dir="${isDir?1:0}" tabindex="-1">
        <div class="ligne">
          ${isDir?html`<button class="tw" tabindex="-1" data-tw="${n.path}" aria-hidden="true">${open?"▾":"▸"}</button>`:html`<span class="tw"></span>`}
          <span class="nomb">${ico}<span>${n.name}</span></span>
        </div>
        ${isDir && open && n.children?.length ? html`<ul role="group">${n.children.map(c=>liTree(c, niveau+1))}</ul>` : ""}</li>`;
    };
    const arbreT = ()=>html`<ul role="tree" aria-label="${T.ariaArbre}">${M.tree.map(n=>liTree(n,1))}</ul>`;

    setH(this, html`<div class="mos-explo">
      <nav class="mos-arbre" aria-label="${T.ariaExplorateur}">${arbreT()}</nav>
      <div class="mos-contenu"></div></div>`);
    const nav = this.querySelector(".mos-arbre");

    const items = ()=>[...nav.querySelectorAll("li[role=treeitem]")];
    const poserTab = (focusPath)=>{
      const tous = items();
      let cible = tous.find(li=>li.dataset.p===focusPath) || tous.find(li=>li.dataset.p===path) || tous[0];
      tous.forEach(li=>li.tabIndex = li===cible ? 0 : -1);
      return cible;
    };
    const reRendre = (focusPath, garderFocus)=>{
      const scroll = nav.scrollTop;
      setH(nav, arbreT());
      brancher();
      const cible = poserTab(focusPath);
      nav.scrollTop = scroll;
      if (garderFocus && cible) cible.focus();
    };
    const brancher = ()=>{
      nav.querySelectorAll(".tw[data-tw]").forEach(b=>{
        b.onclick = e=>{ e.stopPropagation();
          exp.has(b.dataset.tw)?exp.delete(b.dataset.tw):exp.add(b.dataset.tw);
          sauver(); reRendre(b.dataset.tw, false); };
      });
      items().forEach(li=>{
        li.querySelector(":scope > .ligne").onclick = ()=>{
          if (li.dataset.dir==="1"){ exp.add(li.dataset.p); sauver(); }
          vaChemin(li.dataset.p);
        };
        li.onkeydown = e=>{
          if (e.target!==li) return;
          const vis = items(), i = vis.indexOf(li), p = li.dataset.p, isDir = li.dataset.dir==="1";
          const focusA = el=>{ if(el){ vis.forEach(x=>x.tabIndex=-1); el.tabIndex=0; el.focus(); } };
          switch(e.key){
            case "ArrowDown": focusA(vis[i+1]); break;
            case "ArrowUp": focusA(vis[i-1]); break;
            case "Home": focusA(vis[0]); break;
            case "End": focusA(vis[vis.length-1]); break;
            case "ArrowRight":
              if (isDir && !exp.has(p)){ exp.add(p); sauver(); reRendre(p, true); }
              else if (isDir){ const enf = li.querySelector("ul > li"); focusA(enf); }
              break;
            case "ArrowLeft":
              if (isDir && exp.has(p)){ exp.delete(p); sauver(); reRendre(p, true); }
              else { const par = parents.get(p); focusA(vis.find(x=>x.dataset.p===par)); }
              break;
            case "Enter": case " ":
              if (isDir){ exp.add(p); sauver(); }
              vaChemin(p); break;
            default: return;
          }
          e.preventDefault();
        };
      });
    };
    brancher(); poserTab(path);
    this.rendreContenu(path);
  }
  rendreContenu(path){
    const zone = this.querySelector(".mos-contenu"), n = noeudDe(path);
    const segs = path.split("/");
    const ariane = html`<div class="mos-ariane">
      <button data-h="">${M.nom}</button>
      ${segs.map((s,i)=>{
        const p = segs.slice(0,i+1).join("/");
        if (i===segs.length-1) return html`<span class="sep">/</span><span class="ici">${s}</span>`;
        return parPath.has(p)
          ? html`<span class="sep">/</span><button data-h="x/${p}">${s}</button>`

      })}

    const carteEnfant = c => {
      if (c.kind==="fiche"){
        const f = ficheDe(c.path)||{};

          <span class="p">${(c.meta.excerpt||"").slice(0,140)}</span></button>`;
      if (c.kind==="dir"){
        const nb = c.children?.length||0, meta = c.meta;
        const acc = c.path.startsWith("knowledge-base")?domCoul(c.name)
          : c.path.startsWith("inbox")?"var(--encre)":"var(--or)";
        return html`<button class="mos-obj" style="--acc:${acc}" data-h="x/${c.path}">
          ${meta?stDot(meta.status):""}
          <span class="k">${meta?(meta.clos?T.chantierClos:T.chantierEnCours):T.repertoire}</span>
          <span class="t">${meta?.title||c.name}/</span>
          <span class="p">${meta?(meta.desc||"").slice(0,120):T.nbElements(nb)}</span></button>`;
      }
      return html`<button class="mos-obj" data-h="x/${c.path}"><span class="k">${T.fichier}</span><span class="t">${c.name}</span></button>`;
    };
    let corps;
    if (!n){
      corps = html`<div class="mos-erreur"><b>${T.introuvable}</b> ${T.introuvableCorps}</div>`;
    } else if (n.kind==="fiche"){
      corps = html`<mos-fiche path="${path}"></mos-fiche>`;
    } else if (n.kind==="inboxitem"){
      corps = html`<div class="mos-detail" style="border-left:3px solid var(--encre);max-width:820px">
        <p class="k" style="color:var(--encre)">${T.itemInbox(n.meta.date||"?")}</p>
        <h2>${n.meta.title}</h2>
        ${n.meta.body?mdRendu(n.meta.body, path):n.meta.excerpt?html`<p>${n.meta.excerpt}…</p>`:""}</div>`;
    } else if (n.kind==="file"){
      const taille = humain(n.size), local = lienLocal(path), abs = cheminAbs(path);
      if (n.body){
        corps = html`<div class="mos-detail" style="max-width:840px">
          <p class="k" style="color:var(--ghost)">${T.documentChantier}${taille?` · ${taille}`:""} — ${T.artefactJetable}</p>
          <h2>${n.name}</h2>${mdRendu(n.body, path)}</div>`;
      } else {
        corps = html`<div class="mos-detail">
          <p class="k" style="color:var(--ghost)">${T.fichier}${taille?` · ${taille}`:""}</p><h2>${n.name}</h2>
          <p class="g">${T.artefactProd}
            ${/\.md$/.test(n.name)?T.contenuNonEmbarque:""}</p>
          ${abs?html`<p class="md-chemin">${abs}</p>`:""}
          ${local?html`<p><a href="${local}">${T.ouvrirLocal}</a>
            <span class="g" style="font-size:.75rem">${T.ouvrirLocalNote}</span></p>`:""}</div>`;
      }
    } else if (path==="production"){
      /* la racine de production répond à LA question : quels chantiers sont en cours ? */
      const enCours=[], parDom=[];
      for (const dom of n.children||[]){
        let closDom=0;
        for (const etat of dom.children||[])
          for (const ch of etat.children||[])
            if (ch.meta){ ch.meta.clos ? closDom++ : enCours.push({ch, dom:dom.name}); }
        parDom.push({nom:dom.name, path:dom.path, clos:closDom});
      }
      enCours.sort((a,b)=>(b.ch.meta.date||"").localeCompare(a.ch.meta.date||""));
      const carteCh = ({ch,dom}) => html`
        <button class="mos-obj" style="--acc:var(--or)" data-h="x/${ch.path}">
          ${stDot(ch.meta.status)}
          <span class="k">${ch.meta.date||""}</span>

      const domsActifs = [...new Set(enCours.map(e=>e.dom))];
      corps = html`
        <h2 class="mos-h2">${T.chantiersEnCours(enCours.length)}</h2>
        ${enCours.length?domsActifs.map(dom=>html`
          <h3 class="mos-h3">${dom}/</h3>
          <div class="mos-enfants">${enCours.filter(e=>e.dom===dom).map(carteCh)}</div>`)
          :html`<p class="mos-vide">${T.aucunChantier}</p>`}
        <h2 class="mos-h2">${T.chantiersClos(M.meta.chantiers_clos)}</h2>
        <div class="mos-enfants">${parDom.map(d=>{
          const cible = parPath.has(d.path+"/done") ? d.path+"/done" : d.path;
          return html`<button class="mos-obj" style="--acc:var(--or)" data-h="x/${cible}">
            <span class="k">${T.repertoire}</span><span class="t">${d.nom}/${cible.endsWith("/done")?"done/":""}</span>
            <span class="p">${T.nbClos(d.clos)}</span></button>`;})}</div>`;
    } else {
      const dansKb = path==="knowledge-base" || path.startsWith("knowledge-base/");
      const entete = n.meta ? html`<div class="mos-detail">
          <p class="k">${n.meta.clos?T.chantierClos:T.chantierEnCours}${n.meta.date?T.ouvertLe(n.meta.date):""}
            ${n.meta.status?html` <span class="mos-puce st-${n.meta.status}">${n.meta.status}</span>`:""}</p>
          <h2>${n.meta.title}</h2>
          ${n.meta.desc?html`<p>${n.meta.desc}</p>`
            :html`<p class="g">${M.profil==="public"?T.profilPublicDesc:T.pasDAbout}</p>`}
          ${n.meta.n_files?html`<p class="k" style="color:var(--ghost)">${T.nbFichiers(n.meta.n_files)}</p>`:""}
        </div>` : "";
      const noteInbox = (path==="inbox" && M.profil==="public")
        ? html`<p class="mos-vide">${T.profilPublicInbox(M.meta.inbox_total)}</p>` : "";
      const enfants = n.children||[];
      corps = html`${entete}${noteInbox}
        ${dansKb?html`<div class="mos-cherche"><input type="search"
          placeholder="${T.chercherPlaceholder}"
          aria-label="${T.chercherAria}"></div><div class="mos-resultats" hidden></div>`:""}
        ${dansKb?html`<mos-graphe scope="${path}"></mos-graphe>`:""}
        ${enfants.length?html`<div class="mos-enfants${dansKb?" avec-graphe":""}">${enfants.map(carteEnfant)}</div>`
          : (n.meta||noteInbox)?"":html`<p class="mos-vide">${T.repertoireVide}</p>`}`;
    }
    setH(zone, html`${ariane}${corps}`);
    zone.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>va(b.dataset.h));

    /* moteur de recherche KB : plein texte (titres > descriptions > corps), le graphe s'estompe en direct */
    const inp = zone.querySelector(".mos-cherche input");
    if (inp){
      const resZone = zone.querySelector(".mos-resultats");
      const graphe = zone.querySelector("mos-graphe");
      const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      let minuterie;
      inp.oninput = () => { clearTimeout(minuterie); minuterie = setTimeout(()=>{
        const q = norm(inp.value.trim());
        if (q.length < 2){ resZone.hidden = true; graphe?.filtrer(null); return; }
        const hits = [];
        for (const [p,f] of Object.entries(M.fiches)){
          let rang = -1, champ = "";
          if (norm(f.title).includes(q) || norm(p.split("/").pop()).includes(q)) rang = 0;
          else if (norm(f.desc).includes(q)){ rang = 1; champ = "desc"; }
          else if (norm(f.body).includes(q)){ rang = 2; champ = "body"; }
          if (rang >= 0) hits.push({p, f, rang, champ});
        }
        hits.sort((a,b)=>a.rang-b.rang || a.p.localeCompare(b.p));
        const extraitDe = h => {
          const src = h.champ==="body" ? h.f.body : h.champ==="desc" ? h.f.desc : "";
          if (!src) return "";
          const brut = src.replace(/\s+/g," ");
          const idx = norm(brut).indexOf(q);
          if (idx < 0) return "";
          const de = Math.max(0, idx-45), a = Math.min(brut.length, idx+q.length+70);
          return {__raw: (de>0?"… ":"") + esc(brut.slice(de, idx)) + "<mark>" +
            esc(brut.slice(idx, idx+q.length)) + "</mark>" + esc(brut.slice(idx+q.length, a)) + (a<brut.length?" …":"")};
        };
        setH(resZone, html`${hits.length?hits.slice(0,20).map(h=>{
          const dom = h.p.split("/").length>2 ? h.p.split("/")[1] : T.racine;
          const ex = extraitDe(h);
          return html`<button class="mos-res" data-h="x/${h.p}">${stDot(h.f.status)}
            <span class="t">${h.f.title}</span><span class="d" style="color:${domCoul(dom)}">${dom}</span>
            ${ex?html`<span class="x">${ex}</span>`:""}</button>`;})
          :html`<p class="mos-vide">${T.rienNeCorrespond(inp.value.trim())}</p>`}
          ${hits.length>20?html`<p class="mos-vide">${T.nbResultats(hits.length)}</p>`:""}`);
        resZone.hidden = false;
        resZone.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>va(b.dataset.h));
        graphe?.filtrer(new Set(hits.map(h=>h.p)));
      }, 140); };
    }
  }
}

/* ================= mos-graphe : corpus lié, scopé au répertoire =================
   Deux modes : « répertoires » (agrégé) · « fichiers » (à plat, à la Obsidian).
   Les index.md sont des catalogues : hors graphe. Positions initiales déterministes. */
class MosGraphe extends HTMLElement{
  connectedCallback(){ this.mode = this.mode || "fichiers"; this.rendre(); }
  disconnectedCallback(){ this._sim?.stop(); }
  rendre(){
    this._sim?.stop();
    const scope = this.getAttribute("scope"), scNoeud = noeudDe(scope);
    if (!scNoeud){ this.hidden = true; return; }
    const estFicheGraphe = p => { const f = ficheDe(p); return f && !f.index; };
    const aDesDirs = (scNoeud.children||[]).some(c=>c.kind==="dir");
    setH(this, html`<div class="scene"><span class="titre-g">${T.webDe(scope.split("/").pop())}</span>
      ${aDesDirs?html`<div class="mode-g" role="group" aria-label="${T.ariaModeGraphe}">
        <button data-m="fichiers" class="${this.mode==="fichiers"?"actif":""}">${T.modeFichiers}</button>
        <button data-m="agrege" class="${this.mode==="agrege"?"actif":""}">${T.modeRepertoires}</button></div>`:""}
      <svg role="img" aria-label="${T.ariaGraphe}"></svg><div class="mos-bulle" hidden></div>
      <div class="outils">
        <button data-z="plus" title="${T.zoomPlus}">＋</button>
        <button data-z="moins" title="${T.zoomMoins}">－</button>
        <button data-z="fit" title="${T.zoomFit}">⛶</button>
      </div></div>`);
    this.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ this.mode=b.dataset.m; this.rendre(); });
    const scene = this.querySelector(".scene"), bulle = this.querySelector(".mos-bulle");
    const svg = d3.select(this.querySelector("svg"));
    const W = scene.clientWidth || 800, H = scene.clientHeight || 390;
    svg.attr("viewBox",`0 0 ${W} ${H}`);
    const dedans = p => p.startsWith(scope+"/");
    const nmap = new Map(), emap = new Map();
    let coteGhost = 0;
    const ghost = p => { if (!nmap.has(p)) nmap.set(p, {id:p, nom:p.split("/").slice(-2).join("/").replace(/\.md$/,""),
      dir:false, ghost:true, cote:(coteGhost++%2)}); };
    if (this.mode==="fichiers" && aDesDirs){
      for (const p of Object.keys(M.fiches))
        if (dedans(p) && estFicheGraphe(p)) nmap.set(p, {id:p, nom:p.split("/").pop().replace(/\.md$/,""), dir:false, ghost:false});
      for (const e of M.edges){
        const ia = dedans(e.a), ib = dedans(e.b);
        if (!ia && !ib) continue;
        if (!ia) ghost(e.a); if (!ib) ghost(e.b);
        const k = [e.a,e.b].sort().join("|");
        emap.set(k, (emap.get(k)||{a:e.a, b:e.b, w:0, ghost:!ia||!ib}));
        emap.get(k).w++;
      }
    } else {
      const rep = p => {
        if (p===scope) return null;
        if (!dedans(p)) return {id:p, ghost:true};
        const rest = p.slice(scope.length+1);
        return rest.includes("/") ? {id: scope+"/"+rest.split("/")[0], ghost:false} : {id:p, ghost:false};
      };
      for (const c of (scNoeud.children||[]))
        if (c.kind==="dir" || estFicheGraphe(c.path))
          nmap.set(c.path, {id:c.path, nom:c.name.replace(/\.md$/,""), dir:c.kind==="dir", ghost:false});
      for (const e of M.edges){
        const ra = rep(e.a), rb = rep(e.b);
        if (!ra || !rb || ra.id===rb.id) continue;
        if (!ra.ghost && !nmap.has(ra.id)) continue;
        if (ra.ghost && rb.ghost) continue;
        if (ra.ghost) ghost(ra.id); if (rb.ghost) ghost(rb.id);
        const k = [ra.id,rb.id].sort().join("|");
        emap.set(k, (emap.get(k)||{a:ra.id,b:rb.id,w:0,ghost:ra.ghost||rb.ghost}));
        emap.get(k).w++;
      }
    }
    if (![...emap.values()].length && nmap.size<2){ this.hidden = true; return; }
    this.hidden = false;
    const nodes=[...nmap.values()], edges=[...emap.values()].map(e=>({...e,source:e.a,target:e.b}));
    /* positions initiales déterministes : même carte à chaque ouverture */
    nodes.forEach(n=>{ const h1=hachage(n.id);
      n.x = W/2 + ((h1%200)-100)*1.4; n.y = H/2 + (((h1/200|0)%160)-80)*1.4; });
    const parId=new Map(nodes.map(n=>[n.id,n]));
    const R=d=>d.ghost?7:(d.dir?15:Math.min(14, 7+(degre.get(d.id)||0)*.9));
    const domDe=p=>{const s=p.split("/");return s[0]==="knowledge-base"?(s.length>2?s[1]:T.racine):s[1];};
    const sim=d3.forceSimulation(nodes)
      .force("liens",d3.forceLink(edges).id(d=>d.id).distance(d=>d.ghost?120:70).strength(.4))
      .force("charge",d3.forceManyBody().strength(-170))
      .force("collision",d3.forceCollide(d=>R(d)+14))
      .force("cx",d3.forceX(d=>d.ghost?(d.cote?W*.9:W*.1):W/2).strength(d=>d.ghost?.25:.06))
      .force("cy",d3.forceY(H/2).strength(.08));
    const g=svg.append("g");
    const arete=g.append("g").selectAll("line").data(edges).join("line")
      .attr("class",e=>`mos-arete${e.ghost?" vers-ghost":""}`).attr("stroke-width",e=>Math.min(3.5,.9+e.w*.7));
    const noeud=g.append("g").selectAll("g").data(nodes).join("g")
      .attr("class",d=>`mos-noeud${d.ghost?" ghost":""}`)
      .call(d3.drag()
        .on("start",(ev,d)=>{if(!ev.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
        .on("drag",(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
        .on("end",(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
      .on("click",(ev,d)=>{ev.stopPropagation();vaChemin(d.id);})
      .on("mousemove",(ev,d)=>{
        const f=ficheDe(d.id);
        bulle.hidden=false;
        setH(bulle, html`<span class="t" style="color:${domCoul(domDe(d.id))}">${d.ghost?T.horsRepertoire:""}${d.dir?T.repertoire:T.fiche}${f?.status?` · ${f.status}`:""}</span><br/>
          <strong>${f?.title||d.nom}</strong>${f?.desc?html`<br/>${f.desc}`:""}`);
        const r=scene.getBoundingClientRect();
        bulle.style.left=`${Math.max(6, Math.min(ev.clientX-r.left+14, r.width-310))}px`;
        bulle.style.top=`${Math.max(6, Math.min(ev.clientY-r.top+14, r.height-90))}px`;})
      .on("mouseleave",()=>bulle.hidden=true);
    noeud.append("circle").attr("class","disque").attr("r",R).attr("stroke",d=>domCoul(domDe(d.id)));
    noeud.filter(d=>d.dir).append("circle").attr("r",3).attr("fill",d=>domCoul(domDe(d.id)));
    noeud.append("text").attr("class","etiquette").attr("y",d=>R(d)+11).text(d=>d.nom);
    sim.on("tick",()=>{
      arete.attr("x1",e=>e.source.x).attr("y1",e=>e.source.y).attr("x2",e=>e.target.x).attr("y2",e=>e.target.y);
      noeud.attr("transform",d=>`translate(${d.x},${d.y})`);});
    /* zoom / pan / cadrage — la mécanique de relations.astro (Final Bosu) */
    const zoom = d3.zoom().scaleExtent([0.35, 4]).on("zoom", ev=>g.attr("transform", ev.transform));
    svg.call(zoom).on("dblclick.zoom", null);
    const cadrer = ()=>{
      const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
      if (!xs.length) return;
      const x0=Math.min(...xs)-60, x1=Math.max(...xs)+60, y0=Math.min(...ys)-60, y1=Math.max(...ys)+60;
      const k=Math.min(2, .95*Math.min(W/(x1-x0), H/(y1-y0)));
      const t=d3.zoomIdentity.translate(W/2-k*(x0+x1)/2, H/2-k*(y0+y1)/2).scale(k);
      svg.transition().duration(420).call(zoom.transform, t);
    };
    this.querySelector("[data-z=plus]").onclick = ()=>svg.transition().call(zoom.scaleBy, 1.4);
    this.querySelector("[data-z=moins]").onclick = ()=>svg.transition().call(zoom.scaleBy, 1/1.4);
    this.querySelector("[data-z=fit]").onclick = cadrer;
    sim.on("end", cadrer);
    setTimeout(cadrer, 900);
    this._sim = sim;
    this._noeud = noeud; this._arete = arete;
  }
  /* estompe les nœuds hors d'un ensemble de chemins (null = tout rallumer) */
  filtrer(garde){
    if (!this._noeud) return;
    if (!garde){ this._noeud.classed("efface", false); this._arete.classed("efface", false); return; }
    this._noeud.classed("efface", d => !garde.has(d.id));
    this._arete.classed("efface", e => !garde.has(e.a) && !garde.has(e.b));
  }
}
customElements.define("mos-graphe", MosGraphe);

/* ================= mos-fiche ================= */
class MosFiche extends HTMLElement{
  connectedCallback(){
    const path=this.getAttribute("path"), f=ficheDe(path)||{};
    const dom=path.split("/").length>2?path.split("/")[1]:T.racine;
    const sortants=M.edges.filter(e=>e.a===path), entrants=M.edges.filter(e=>e.b===path);
    const li=p=>{const g=ficheDe(p);return html`<li><button data-h="x/${p}">${g?.title||p.split("/").pop()}</button></li>`;};
    const revueCourte = f.review && f.review.length<=24;
    setH(this, html`<div class="corps">
      <div class="chips">
        <span class="mos-puce" style="color:${domCoul(dom)}">${dom}</span>
        ${f.type?html`<span class="mos-puce">${f.type}</span>`:""}
        ${f.status?html`<span class="mos-puce st-${f.status}">${f.status}</span>`:""}
        ${revueCourte?html`<span class="mos-puce" style="color:var(--or)">${T.reviewChip(f.review)}</span>`:""}
      </div>
      <h2>${f.title||path.split("/").pop()}</h2>
      ${f.review&&!revueCourte?html`<p class="review" title="${f.review}">${T.aRevoir(f.review)}</p>`:""}
      ${f.desc?html`<p class="desc">${f.desc}</p>`:""}
      ${f.body?mdRendu(f.body, path):f.excerpt?html`<p class="extrait">${f.excerpt}…</p>`:""}
      ${M.profil==="public"?html`<p class="vide-l">${T.profilPublicFiche}</p>`:""}
      ${f.index?html`<p class="vide-l">${T.nomReserve}</p>`:html`
      <h3>${T.liensSortants(sortants.length)}</h3>
      ${sortants.length?html`<ul>${sortants.map(e=>li(e.b))}</ul>`:html`<p class="vide-l">${T.aucunLien}</p>`}
      <h3>${T.referenceePar(entrants.length)}</h3>
      ${entrants.length?html`<ul>${entrants.map(e=>li(e.a))}</ul>`:html`<p class="vide-l">${T.aucuneEntree}</p>`}`}
    </div>`);
    this.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>va(b.dataset.h));
  }
}
customElements.define("mos-fiche", MosFiche);

/* ================= mos-frise ================= */
class MosFrise extends HTMLElement{
  connectedCallback(){
    /* "tous" reste la valeur SENTINELLE interne (data-t, comparaisons) ; seul l'affichage se traduit */
    let filtre="tous";
    const types=["tous",...new Set(M.log.map(e=>e.type))];
    setH(this, html`<div class="mos-filtre">${types.map(t=>
      html`<button data-t="${t}" style="${t!=="tous"?`color:${typC(t)}`:""}" class="${t==="tous"?"actif":""}">
        ${t==="tous"?T.tous:t} (${t==="tous"?M.log.length:M.log.filter(e=>e.type===t).length})</button>`)}</div>
      <div class="mos-frise"></div>`);
    const rendre=()=>{ setH(this.querySelector(".mos-frise"),
      html`${M.log.filter(e=>filtre==="tous"||e.type===filtre).map(e=>html`
        <div class="mos-entree" style="--tc:${typC(e.type)}">
          <span class="d">${e.date}</span><span class="tt">${e.type}</span><span class="ti">${e.title}</span></div>`)}`); };
    this.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
      filtre=b.dataset.t;
      this.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("actif",x===b));
      rendre();});
    rendre();
    if (!M.log.length) setH(this.querySelector(".mos-frise"), html`<p class="mos-vide">${T.journalVide}</p>`);
  }
}
customElements.define("mos-frise", MosFrise);

render();
